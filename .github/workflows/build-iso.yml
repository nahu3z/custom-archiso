name: Build Arch ISO

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Arch package manager
        shell: bash
        run: |
          set -euxo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman --noconfirm -Syu --needed archlinux-keyring archiso git

      - name: Ensure pacman.conf exists in profile
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f "$GITHUB_WORKSPACE/profile/pacman.conf" ]; then
            cp /etc/pacman.conf "$GITHUB_WORKSPACE/profile/pacman.conf"
          fi

      - name: Build ISO
        shell: bash
        run: |
          set -euxo pipefail

          export PROFILE_PATH="$GITHUB_WORKSPACE/profile"
          export WORK_DIR="/tmp/archlive-work"
          export OUT_DIR="/tmp/archlive-out"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PROFILE_PATH=$PROFILE_PATH"

          ls -la "$GITHUB_WORKSPACE"
          ls -la "$PROFILE_PATH"

          test -d "$PROFILE_PATH"
          test -f "$PROFILE_PATH/profiledef.sh"

          rm -rf "$WORK_DIR" "$OUT_DIR"
          mkdir -p "$WORK_DIR" "$OUT_DIR"

          mkarchiso -v -w "$WORK_DIR" -o "$OUT_DIR" "$PROFILE_PATH"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-custom-iso
          path: /tmp/archlive-out/*.iso
          if-no-files-found: error
