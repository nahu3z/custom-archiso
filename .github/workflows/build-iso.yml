name: Build Arch ISO

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/archiso-work /tmp/archiso-out

      - name: Build ISO in Arch container
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -v /tmp/archiso-work:/work \
            -v /tmp/archiso-out:/out \
            -w /src \
            archlinux:latest \
            bash -lc '
              set -euxo pipefail

              echo "Repo root:"
              ls -la /src
              echo "Profile dir:"
              ls -la /src/profile

              pacman-key --init
              pacman-key --populate archlinux
              pacman --noconfirm -Syu --needed archlinux-keyring archiso git

              if [ ! -f /src/profile/pacman.conf ]; then
                cp /etc/pacman.conf /src/profile/pacman.conf
              fi

              test -d /src/profile
              test -f /src/profile/profiledef.sh

              mkarchiso -v -w /work -o /out /src/profile
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-custom-iso
          path: /tmp/archiso-out/*.iso
          if-no-files-found: error
