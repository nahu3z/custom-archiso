name: Build Arch ISO

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Arch package manager
        shell: bash
        run: |
          set -euxo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman --noconfirm -Syu --needed archlinux-keyring archiso git

      - name: Ensure pacman.conf exists in profile
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f ./profile/pacman.conf ]; then
            cp /etc/pacman.conf ./profile/pacman.conf
          fi

      - name: Build ISO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/archlive-work /tmp/archlive-out
          mkarchiso -v -w /tmp/archlive-work -o /tmp/archlive-out ./profile

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-custom-iso
          path: /tmp/archlive-out/*.iso
          if-no-files-found: error
