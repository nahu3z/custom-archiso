name: Build Arch ISO

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build ISO with official releng profile
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -v /tmp/archiso-work:/work \
            -v /tmp/archiso-out:/out \
            -w /src \
            archlinux:latest \
            bash -lc '
              set -euxo pipefail

              pacman-key --init
              pacman-key --populate archlinux
              pacman --noconfirm -Syu --needed archlinux-keyring archiso git

              BUILD_DIR=/tmp/releng-profile
              rm -rf "$BUILD_DIR"
              mkdir -p "$BUILD_DIR"

              cp -a /usr/share/archiso/configs/releng/. "$BUILD_DIR"/

              if [ -f /src/profile/profiledef.sh ]; then
                cp /src/profile/profiledef.sh "$BUILD_DIR/profiledef.sh"
              fi

              if [ -f /src/profile/packages.x86_64 ]; then
                cp /src/profile/packages.x86_64 "$BUILD_DIR/packages.x86_64"
              fi

              if [ -f /src/profile/pacman.conf ]; then
                cp /src/profile/pacman.conf "$BUILD_DIR/pacman.conf"
              fi

              test -f "$BUILD_DIR/profiledef.sh"
              test -f "$BUILD_DIR/packages.x86_64"

              mkarchiso -v -w /work -o /out "$BUILD_DIR"
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: custom-archiso
          path: /tmp/archiso-out/*.iso
          if-no-files-found: error